<!doctype html>
<html lang="en">
  <head>
    <script defer src="script.js" type="module"></script>
    <link rel="stylesheet" href="style.css" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="title" content="Three Amigos - Card Game" />
    <meta name="author" content="Rui Viveiros" />

    <title>Three Amigos</title>
  </head>
  <body>
    <header>
      <h1>Three Amigos</h1>
      <p class="tagline">Be the first to empty your hand and table!</p>
    </header>

    <!-- Setup Screen -->
    <div id="setup-screen">
      <div class="setup-container">
        <h2>Start New Game</h2>
        <div class="player-count">
          <label>Number of Players:</label>
          <div class="player-buttons">
            <button class="player-btn" data-count="2">2</button>
            <button class="player-btn" data-count="3">3</button>
            <button class="player-btn" data-count="4">4</button>
          </div>
        </div>
        <div id="player-names" class="player-names hidden"></div>
        <button id="start-game-btn" class="hidden">Start Game</button>
      </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="hidden">
      <div class="game-header">
        <div class="turn-indicator">
          <span id="current-player-name"></span>'s Turn
        </div>
        <div class="game-controls">
          <button id="pickup-btn">Pick Up Pile</button>
          <button id="end-turn-btn">End Turn</button>
          <button id="new-game-btn">New Game</button>
        </div>
      </div>

      <div class="game-board">
        <!-- Top players (faceUp visible, faceDown hidden) -->
        <div id="opponents-area" class="opponents-area"></div>

        <!-- Center area: pile + deck -->
        <div class="center-area">
          <div class="pile-container">
            <div class="pile-label">Pile</div>
            <div id="pile" class="pile"></div>
          </div>
          <div class="deck-container">
            <div class="deck-label">Deck: <span id="deck-count">0</span></div>
            <div id="deck" class="deck"></div>
          </div>
        </div>

        <!-- Current player area -->
        <div id="current-player-area" class="current-player-area">
          <div class="player-header">
            <span class="player-name"></span>
            <span class="card-count"></span>
          </div>
          <div class="player-cards">
            <div class="card-section">
              <div class="section-label">Hand</div>
              <div id="current-hand" class="card-row hand"></div>
            </div>
            <div class="card-section">
              <div class="section-label">Face Up</div>
              <div id="current-face-up" class="card-row face-up"></div>
            </div>
            <div class="card-section">
              <div class="section-label">Face Down</div>
              <div id="current-face-down" class="card-row face-down"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Status message -->
      <div id="status-message" class="status-message"></div>
    </div>

    <!-- Win Modal -->
    <div id="win-modal" class="modal hidden">
      <div class="modal-content">
        <h2 id="winner-name">Winner!</h2>
        <p>Congratulations!</p>
        <button id="play-again-btn">Play Again</button>
      </div>
    </div>
  </body>
</html>
